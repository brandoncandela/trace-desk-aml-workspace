<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa9ff"/><stop offset="1" stop-color="#0066cc"/></linearGradient>
  <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b93ff"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
  <radialGradient id="glowA" cx=".2" cy=".15" r=".6"><stop offset="0" stop-color="#5aa9ff" stop-opacity=".45"/><stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx=".9" cy=".9" r=".6"><stop offset="0" stop-color="#8b93ff" stop-opacity=".4"/><stop offset="1" stop-color="#8b93ff" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a8a" flood-opacity=".10"/></filter>
</defs>
<style>
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .flow { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
  @keyframes pulse { 50% { transform: scale(1.18); opacity: .75; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; stroke-dashoffset: 0 !important; } }
</style>
